[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrapit"
version = "1.0.0"
description = "Polite terminal website path fetcher for authorized security testing"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["security", "web", "content-discovery", "cli", "tui", "education"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = [
    "httpx==0.28.1",
    "rich==15.0.0",
    "questionary==2.1.1",
]

[project.urls]
Repository = "https://github.com/S4rtx/scrapit"

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[project.scripts]
scrapit = "scrapit.cli:main"

[tool.setuptools.packages.find]
include = ["scrapit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
